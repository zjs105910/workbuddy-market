<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">pstack-t3</title>
  <desc id="desc">Your request goes to one coordinator thread per project. Claude, Codex, Grok, and Cursor write and review the change through T3's orchestrator. The landing queue runs the checks and lands it on trunk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1a1d29"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f5f5f7">pstack-t3</text>
  <text x="72" y="172" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a1a1aa">Careful engineering from every model you have.</text>
  <text x="72" y="212" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#71717a">Lauren Tan's pstack, ported to T3 Code's orchestrator.</text>
  <text x="72" y="240" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#71717a">Plus a standing coordinator for each project.</text>
  <text x="72" y="282" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#71717a">Skills you type in any T3 thread</text>
  <text x="72" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e4e4e7">$poteto-mode  $interrogate  $swarm  $brigade</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="785" y="40" width="280" height="44" rx="12" fill="#27272a" stroke="#52525b"/>
    <text x="925" y="68" fill="#f5f5f7" font-weight="600">your request</text>
    <line x1="925" y1="84" x2="925" y2="108" stroke="#52525b" stroke-width="2"/>
    <rect x="745" y="108" width="360" height="44" rx="10" fill="#1e293b" stroke="#3b82f6"/>
    <text x="925" y="136" fill="#bfdbfe">coordinator · one thread per project</text>
    <path d="M805 152 L760 188 M885 152 L870 188 M965 152 L980 188 M1045 152 L1090 188" stroke="#52525b" stroke-width="2" fill="none"/>
    <rect x="712" y="188" width="96" height="40" rx="20" fill="#2a2320" stroke="#d97757"/>
    <text x="760" y="214" fill="#f4c7b4">Claude</text>
    <rect x="822" y="188" width="96" height="40" rx="20" fill="#1f2a24" stroke="#10a37f"/>
    <text x="870" y="214" fill="#b6e8d6">Codex</text>
    <rect x="932" y="188" width="96" height="40" rx="20" fill="#26262b" stroke="#a1a1aa"/>
    <text x="980" y="214" fill="#e4e4e7">Grok</text>
    <rect x="1042" y="188" width="96" height="40" rx="20" fill="#1f2937" stroke="#22c55e"/>
    <text x="1090" y="214" fill="#bbf7d0">Cursor</text>
    <path d="M760 228 L805 264 M870 228 L885 264 M980 228 L965 264 M1090 228 L1045 264" stroke="#52525b" stroke-width="2" fill="none"/>
    <rect x="745" y="264" width="360" height="44" rx="12" fill="#27272a" stroke="#52525b"/>
    <text x="925" y="292" fill="#f5f5f7" font-weight="600">landing queue · checks · trunk</text>
    <text x="925" y="336" fill="#71717a" font-size="15">one model writes, another family reviews, the queue lands</text>
  </g>
</svg>
