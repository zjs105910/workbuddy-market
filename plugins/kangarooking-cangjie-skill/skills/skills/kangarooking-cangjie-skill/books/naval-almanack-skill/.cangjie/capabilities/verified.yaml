schema_version: 1
bundle_id: bundle.naval-almanack
book:
  title: 《纳瓦尔宝典：财富与幸福指南》
  author: 纳瓦尔·拉维坎特（Eric Jorgenson 整理）
  source_pack: books/naval-almanack-skill
  baseline_tag: baseline-naval-19skill-20260825
entry:
  name: naval-almanack
  description: '当用户询问《纳瓦尔宝典》(The Almanack of Naval Ravikant) 相关内容，或在以下领域寻求建议时调用:

    财富构建(怎么赚钱/股权期权/杠杆/副业与职业定位/时薪与外包决策)、判断与决策(重大选择纠结/心智模型/打工vs创业)、

    幸福与心智(欲望与焦虑/接受与内耗/冥想/刷手机上瘾/愤怒与期望/攀比妒忌)、人生哲学(生命意义/该不该信玄学/诚实沟通/选朋友圈子/怎么读书学习)。

    不适用于: 具体投资标的与选股、临床心理治疗、急性危机(先求助专业人士)。

    Triggers: 纳瓦尔/Naval/纳瓦尔宝典/致富/财富/幸福/判断力/冥想/读书/人生意义

    '
  core_principles:
  - 财富=睡觉时仍在赚钱的资产；靠「责任→产权→杠杆」构建，无法靠出租时间致富。
  - 用特殊知识（对你像玩、对别人像工作）产品化自己，成为不可替代。
  - 判断力比努力重要；无法决定就答否；两条均等的路选短期更痛苦的那条。
  - 财富、知识、声誉、关系都遵循复利；只玩长期正和游戏，与能共事一辈子的人同行。
  - 幸福是可训练的技能：减少欲望、活在当下；任何处境只有三选项——改变/接受/离开。
  - 阅读是终极元技能：读你所爱、原著优先，每天 1-2 小时即进入极少数人行列。
  out_of_scope:
  - 具体投资标的分析、选股与理财产品建议
  - 临床抑郁、精神疾病急性发作等需要专业治疗的场景（先就医）
  - 急性自杀风险（先紧急求助）
  - 需要外交辞令的谈判策略与具体薪酬数字
  stop_conditions:
  - 意图在路由表与能力索引中均无法命中 → 明确告知超出本书范围，不硬套书中框架。
  - 涉及医疗/法律/人身安全 → 停止套用方法论，建议专业求助。
  - 纯事实查询（书名/作者/出版年/章节）→ 用核心原则与 overview 回答后即停，不展开人生建议。
router_entry:
  name: naval-almanack
  description: '当用户询问《纳瓦尔宝典》这本书本身(书名/作者/章节/整书概览/术语)，或涉及本书未独立成 Skill 的主题时调用:

    幸福训练/欲望管理、接受与内耗、冥想与心猴、地位游戏与攀比、选朋友与圈子、打工vs创业(委托代理)、

    诚实沟通、身份与自我形象、期望与愤怒、生命意义、该不该信玄学(理性验证)、长期复利与声誉、判断力训练。

    以下意图优先使用同包独立 Skill: wealth-structure(致富/股权期权)、productize-yourself(职业定位/副业方向)、

    decision-heuristics(重大选择纠结)、hourly-rate-time(时薪/外包/时间分配)、reading-metaskill(怎么读书学习)、screen-detox(刷手机上瘾)。

    Triggers: 纳瓦尔/Naval/纳瓦尔宝典/幸福/冥想/内耗/攀比/圈子/复利/人生意义

    '
promotion_budget: 8
