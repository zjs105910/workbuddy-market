<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 本机 API 的一次性口令：由服务端在返回本页时注入。
     第三方网页即使能访问 127.0.0.1:8777，也读不到这个值（跨源读响应被浏览器挡住），
     所以拿它当 CSRF token 用。 -->
<meta name="market-token" content="__MARKET_TOKEN__">
<title>本机插件市场 · WorkBuddy</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-row">
      <div class="logo">◈</div>
      <div class="grow">
        <h1 id="mName">本机插件市场</h1>
        <div class="sub" id="mSub">加载中…</div>
      </div>
      <div class="actions">
        <button class="ghost" id="btnDoctor" title="只读体检：配置 / 事务 / 回收站 / 依赖">体检</button>
        <button class="ghost" id="btnUpdate" style="display:none">更新中心</button>
        <button class="ghost" id="btnTrash">回收站</button>
        <button class="ghost" id="btnLog">事件流</button>
        <button id="btnSync" title="从 ~/.workbuddy/skills 重新打包">重新打包</button>
        <button class="primary" id="btnReg">注册到 WorkBuddy</button>
      </div>
    </div>
    <div class="metrics" id="metrics"></div>
    <details class="adv" id="adv">
      <summary>高级信息（市场 ID / 校验档位 / 内部路径等）</summary>
      <div class="adv-body" id="advBody"></div>
    </details>
  </header>

  <div id="hint"></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="市场主入口">
    <button class="tab on" id="tab-local" data-tab="local" role="tab" aria-selected="true">本机技能</button>
    <button class="tab" id="tab-curated" data-tab="curated" role="tab" aria-selected="false">精选市场</button>
    <button class="tab" id="tab-explore" data-tab="explore" role="tab" aria-selected="false">探索 GitHub</button>
  </nav>

  <div class="toolbar">
    <div class="search"><input id="q" placeholder="搜索插件、关键词、GitHub 仓库…" autocomplete="off" aria-label="搜索插件"></div>
    <div class="chips" id="cats"></div>
    <div class="chips" id="filters" role="group" aria-label="筛选">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="todo">未装完</button>
      <button class="chip" data-f="done">已装好</button>
      <button class="chip" data-f="fav">♥ 我的收藏</button>
    </div>
  </div>

  <div id="content"></div>

  <footer>
    本机插件市场 · 改 <code>market.config.json</code> 后点「重新打包」即可增删市场内容 ·
    市场根与数据目录等内部路径见顶部「高级信息」
  </footer>
</div>

<div class="drawer" id="drawer">
  <h4>事件流 <span style="flex:1"></span><button class="ghost tiny" id="btnLogClose">关闭</button></h4>
  <div class="list" id="logList"></div>
</div>

<div class="veil" id="veil">
  <div class="modal">
    <h4><span id="jobTitle">执行中</span></h4>
    <div class="bar"><i id="jobBar"></i></div>
    <div class="joblabel" id="jobLabel">准备中…</div>
    <pre class="out" id="jobOut"></pre>
    <div class="modal-foot"><button id="jobClose" disabled>后台继续</button></div>
  </div>
</div>

<div class="veil" id="cfm">
  <div class="modal">
    <h4 id="cfmTitle">确认</h4>
    <div class="body" id="cfmBody"></div>
    <div class="modal-foot">
      <button id="cfmNo">取消</button>
      <button class="primary" id="cfmYes">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- v2.22：前端拆为 ES Modules（零构建零依赖不变）。
     module 脚本默认 defer，时序与旧版 body 末尾脚本一致。 -->
<script type="module" src="/static/app/main.js"></script>
</body>
</html>
