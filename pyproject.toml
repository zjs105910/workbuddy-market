[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-market"
description = "Local-first plugin marketplace for WorkBuddy: package local skills, register into WorkBuddy, browse & install from a 127.0.0.1-only web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zjs105910" }]
keywords = ["workbuddy", "skill", "plugin", "marketplace", "agent-skills", "ai-agents", "developer-tools", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: Microsoft :: Windows",
    # POSIX 的真实 WorkBuddy 宿主集成仍未验证。CI 覆盖 POSIX 语义冒烟与 pytest；
    # 完整隔离 selftest 硬门槛暂只在 Windows 跑（平台状态见 README / ADVANCED_GUIDE）。
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
]
# 版本号唯一来源仍是 src/workbuddy_market/version.py（约定不变），
# 这里动态读取，避免出现第二个要同步的常量。
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zjs105910/workbuddy-market"
Repository = "https://github.com/zjs105910/workbuddy-market"
Documentation = "https://github.com/zjs105910/workbuddy-market/blob/main/ADVANCED_GUIDE.md"
Issues = "https://github.com/zjs105910/workbuddy-market/issues"
Security = "https://github.com/zjs105910/workbuddy-market/blob/main/SECURITY.md"
Changelog = "https://github.com/zjs105910/workbuddy-market/blob/main/CHANGELOG.md"

[project.scripts]
# 高级用户入口（在仓库 clone 目录内运行，操作当前 clone 的市场）；
# Windows 新手入口仍是一键启动.cmd —— 两条路一个内核。
workbuddy-market = "workbuddy_market.cli:main"

[project.optional-dependencies]
# 开发者测试框架（v3-roadmap P1：pytest 承担日常回归，selftest 保留为
# 零依赖一键环境诊断）。`pip install -e .[dev]` 或 CI 里单装 pytest。
# ruff 与 CI lint job 同版本 pin（规则集在 [tool.ruff.lint]）。
dev = ["pytest>=8.0", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 静态分析（CI 门禁）。target 与 requires-python 对齐。
target-version = "py310"

[tool.ruff.lint]
# 只收「真实缺陷类」：E4/E7/E9（pycodestyle 错误子集：E402 模块级导入位置、
# E722 裸 except、E702 分号语句、E741 单字母变量名）+ F（Pyflakes：F401 未用
# 导入、F841 未用变量、F541 无占位符 f-string、未定义名）。
# 刻意不收（原因写清，避免后来者「顺手扩大」）：
#   · I（import 排序）——market_core 的再导出块按模块迁移史排序、函数内懒加载
#     按用途分组，机械排序会破坏文档意图；
#   · BLE001 / S / PL（宽 except、try-except-pass 等）——防御性宽捕获是本项目
#     既定设计（文件系统工具面对任意用户态），需要豁免的点已就地 noqa 声明；
#   · UP（pyupgrade）——显式 encoding="utf-8"、% 格式化等是本项目编码/输出
#     纪律，不追时尚；真要收的那天按文件渐进，别一刀切。
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = { attr = "workbuddy_market.version.MARKET_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
