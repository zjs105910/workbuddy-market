name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 跨 OS 跑语法检查：msvcrt/fcntl、junction/symlink、进程树击杀
        # 都是本项目历史上踩过平台差异的点（linux 侧自检尚未完全适配，
        # 故 selftest 目前仅在 windows 上作为硬门槛）。
        # v2.18：加 macOS 槽位（评审 11）——真 POSIX 语义（fcntl/symlink）
        # 在 darwin 上与 linux 同源但从未验证过；先跑语义冒烟 + pytest。
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # 本项目本身是软件分发系统，所有第三方 action 一律 pin 到完整 SHA
      # （供应链防护；升级时换 SHA 并同步注释里的版本号）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        shell: bash   # Windows runner 默认 pwsh 不展开 *.py 通配符，必须显式用 bash
        run: python -m py_compile market_core.py market_server.py launcher.py selftest.py src/workbuddy_market/*.py scripts/*.py
      - name: Privacy audit (tracked files)
        run: python scripts/privacy-audit.py
      - name: Registry contract validation
        run: python scripts/validate_registry.py registry/plugins.json
      - name: POSIX semantic smoke (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/posix-smoke.py
      - name: Unit tests (pytest, platform-neutral subset)
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q
      - name: Isolated selftest (Windows only)
        if: runner.os == 'Windows'
        run: python selftest.py

  # 静态分析（v2.34 接入）：ruff 只查真实缺陷类（未用导入/变量、未定义名、
  # 裸 except、分号语句、单字母变量名）。规则集钉死在 pyproject.toml
  # [tool.ruff.lint]，不随 ruff 版本默认集漂移。独立 job 不进跨平台矩阵——
  # 一次运行覆盖全仓库，版本 pin 死（升级时手动换号并同步此注释）。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.17.0
      # 路径与 py_compile 同口径：bundled/ plugins/ 是技能内容，不进门禁
      - name: Ruff check
        run: python -m ruff check market_core.py market_server.py launcher.py selftest.py src/ scripts/ tests/

  # 打包链路（评审 10）：源码跑得通 ≠ wheel 装得上。构建 wheel → 安装 →
  # CLI smoke（doctor --help 必须退出 0），把「pip 装完就坏」挡在 CI 里。
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: CLI smoke (wheel-installed, outside clone)
        shell: bash
        run: |
          workbuddy-market doctor --help
          python -c "from workbuddy_market import version, cli, adapters; print(version.MARKET_VERSION)"

  # 浏览器冒烟（v2.21 评审 P1）：scripts/ui_smoke.py 一直存在但没进 CI，
  # CI 绿 ≠ 前端交互正常。独立 job 不进跨平台矩阵 —— 只跑 ubuntu 一个槽位，
  # 避免每个 OS 重复下载 Chromium。--ci 门禁模式：playwright 缺失或核心
  # 检查（ES Modules / 卡片渲染 / 详情弹窗 / 本机安装 / 收藏）被跳过 → 硬失败，
  # 不出假绿（run #2 的 fail-open 教训同样适用于测试基建）。
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: UI smoke (headless Chromium, CI gate)
        run: python scripts/ui_smoke.py --ci
