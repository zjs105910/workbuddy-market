name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 跨 OS 跑语法检查：msvcrt/fcntl、junction/symlink、进程树击杀
        # 都是本项目历史上踩过平台差异的点（linux 侧自检尚未完全适配，
        # 故 selftest 目前仅在 windows 上作为硬门槛）。
        # v2.18：加 macOS 槽位（评审 11）——真 POSIX 语义（fcntl/symlink）
        # 在 darwin 上与 linux 同源但从未验证过；先跑语义冒烟 + pytest。
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # 本项目本身是软件分发系统，所有第三方 action 一律 pin 到完整 SHA
      # （供应链防护；升级时换 SHA 并同步注释里的版本号）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        shell: bash   # Windows runner 默认 pwsh 不展开 *.py 通配符，必须显式用 bash
        run: python -m py_compile market_core.py market_server.py launcher.py selftest.py src/workbuddy_market/*.py scripts/*.py
      - name: Privacy audit (tracked files)
        run: python scripts/privacy-audit.py
      - name: Registry contract validation
        run: python scripts/validate_registry.py registry/plugins.json
      - name: POSIX semantic smoke (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/posix-smoke.py
      - name: Unit tests (pytest, platform-neutral subset)
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q
      - name: Isolated selftest (Windows only)
        if: runner.os == 'Windows'
        run: python selftest.py

  # 打包链路（评审 10）：源码跑得通 ≠ wheel 装得上。构建 wheel → 安装 →
  # CLI smoke（doctor --help 必须退出 0），把「pip 装完就坏」挡在 CI 里。
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: CLI smoke (wheel-installed, outside clone)
        shell: bash
        run: |
          workbuddy-market doctor --help
          python -c "from workbuddy_market import version, cli, adapters; print(version.MARKET_VERSION)"
