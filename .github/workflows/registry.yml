name: Registry

# 社区注册表每日重建：拉一遍 plugins.json 里每个仓库的 stars / pushedAt /
# latestSha，有变化就开 Pull Request。
#
# 供应链约束（v2.12）：本工作流**不再直推 main**——自动写主分支的链路
# 改为「生成 → 分支 → PR → CI → 人工合并」，和插件安装一样 fail 闭环。
# 静态收录字段永远是人工维护的，机器只补动态数据。
on:
  schedule:
    - cron: "21 21 * * *"     # 每天 21:21 UTC（北京时间次日 5:21，避开整点高峰）
  workflow_dispatch:          # 手动触发（收录新条目后想立刻补数据时用）

permissions:
  contents: write             # 推刷新分支
  pull-requests: write        # 开 / 更新 PR

concurrency:
  group: registry
  cancel-in-progress: false   # 两次运行重叠时排队，不互相踩提交

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # pin 到完整 SHA（与 ci.yml 同一约束）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Refresh dynamic fields
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 只进请求头，脚本不落盘
        run: python scripts/build_registry.py

      # 收录契约门禁（v2.22）：重建后的注册表过不了契约就中止——
      # 宁可不开 PR，也不让坏数据走到人工合并那一步。
      - name: Validate registry contract
        run: python scripts/validate_registry.py registry/plugins.json

      # README 收录清单表格（v2.31）：从重建后的注册表渲染「已收录插件」
      # 表格进两份 README 的标记区间。脚本只读静态字段，无网络依赖。
      - name: Render registry table into README
        run: python scripts/render_registry_readme.py

      # PAT 建 PR（2026-10-12 CI 队列修复）：GITHUB_TOKEN 开的 PR，其 pull_request CI 永远
      # 挂在 action_required（GitHub 防递归，bot 无法自批，#2–#6 全中实锤）；
      # PAT 开的 PR actor 是人，CI 自动正常跑（人工建的 #1 对照实证）。
      # secret 建议用细粒度 PAT：本仓库 Contents RW + Pull requests RW。
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "!! 缺少 secrets.REGISTRY_PAT —— 没有 PAT，bot 开的 PR 拿不到 CI 结论（永远 action_required）"
            exit 1
          fi
          if git diff --quiet -- registry/plugins.json README.md README_EN.md; then
            echo "registry/plugins.json 与 README 表格均无变化，跳过"
            exit 0
          fi
          BR="registry-refresh/$(date -u +%F)"
          TITLE="registry: daily refresh $(date -u +%F)"
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add registry/plugins.json README.md README_EN.md
          git commit -m "$TITLE"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "$TITLE" \
            --body "自动刷新注册表动态字段（stars / pushedAt / latestSha）。静态字段未动；合并前等 CI 通过。" \
            || {
              if gh pr view "$BR" --json number >/dev/null 2>&1; then
                echo "该分支的 PR 已存在，跳过创建"
              else
                echo "!! gh pr create 失败且 PR 不存在 —— 检查 REGISTRY_PAT 是否有效且含 Contents RW + Pull requests RW"
                exit 1
              fi
            }
          NEW_NUM=$(gh pr view "$BR" --json number --jq .number)
          # 收敛（2026-10-12 CI 队列修复）：关闭被本次取代的同类型旧 PR，过期变更不再累积
          gh pr list --state open --limit 100 --json number,title,headRefName \
            --jq ".[] | select(.title == \"$TITLE\" and .headRefName != \"$BR\") | .number" \
          | while read -r n; do
              [ -n "$n" ] || continue
              gh pr close "$n" --comment "被 #$NEW_NUM（更新的 daily refresh）取代，自动关闭。"
            done
