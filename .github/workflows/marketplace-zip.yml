name: Marketplace zip

on:
  schedule:
    - cron: "30 20 * * *"   # 每日 04:30 北京时间，注册表日更之后
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-zip
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Build marketplace zip from curated registry
        run: python scripts/build_marketplace_zip.py --out dist/workbuddy-marketplace.zip

      - name: Publish to rolling marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view marketplace --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload marketplace dist/workbuddy-marketplace.zip dist/workbuddy-marketplace.manifest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create marketplace dist/workbuddy-marketplace.zip dist/workbuddy-marketplace.manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "WorkBuddy Community Marketplace (rolling)" \
              --notes "精选社区市场的 WorkBuddy 原生 zip 快照，每日自动重建。下载 workbuddy-marketplace.zip 后在 WorkBuddy 插件面板添加自定义市场即可使用；想要安装前四问 / 所有权分级 / 可恢复卸载，请使用完整版 WorkBuddy Market。"
          fi

      - name: Publish native marketplace branch (one-command add)
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          # 与 zip 同一份审核快照，发布成 git 分支市场：
          # /plugin marketplace add https://github.com/$GITHUB_REPOSITORY.git#marketplace
          # 内容没变时脚本自动跳过（tree hash 比对），PAT 缺失时如实失败。
          python scripts/publish_marketplace_branch.py \
            --zip dist/workbuddy-marketplace.zip \
            --repo "$GITHUB_REPOSITORY" --branch marketplace
