name: Demo video

on:
  push:
    branches: [main]
    paths:
      - "scripts/record_demo.py"
      - "scripts/ui_smoke.py"
      - "market_server.py"
      - "market_core.py"
      - "src/workbuddy_market/**"
      - "web/**"
      - "registry/plugins.json"
      - "market.config.example.json"
      - ".github/workflows/demo-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install media and Mandarin voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Record reproducible demo from the real app
        run: |
          python scripts/record_demo.py \
            --output dist/workbuddy-market-demo.mp4 \
            --subtitles dist/workbuddy-market-demo.zh-CN.srt \
            --manifest dist/demo-manifest.json

      - name: Upload MP4, subtitles, and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbuddy-market-demo-${{ github.sha }}
          path: |
            dist/workbuddy-market-demo.mp4
            dist/workbuddy-market-demo.zh-CN.srt
            dist/demo-manifest.json
          if-no-files-found: error
          retention-days: 30
