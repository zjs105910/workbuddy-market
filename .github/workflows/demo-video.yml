name: Demo video

on:
  push:
    branches: [main]
    paths:
      - "scripts/record_demo.py"
      - "scripts/package_demo_video.py"
      - "scripts/ui_smoke.py"
      - "market_server.py"
      - "market_core.py"
      - "src/workbuddy_market/**"
      - "web/**"
      - "registry/plugins.json"
      - "market.config.example.json"
      - ".github/workflows/demo-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install media and Mandarin voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Record reproducible demo from the real app
        run: |
          python scripts/record_demo.py \
            --output dist/workbuddy-market-demo.mp4 \
            --subtitles dist/workbuddy-market-demo.zh-CN.srt \
            --manifest dist/demo-manifest.json

      - name: Polish landscape and render vertical social cut
        run: |
          python -m pip install --upgrade pillow
          python scripts/package_demo_video.py \
            --input dist/workbuddy-market-demo.mp4 \
            --subtitles dist/workbuddy-market-demo.zh-CN.srt \
            --manifest dist/demo-manifest.json \
            --output dist/workbuddy-market-demo.mp4 \
            --vertical-output dist/workbuddy-market-demo-vertical.mp4

      - name: Upload MP4s, subtitles, and manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: workbuddy-market-demo-${{ github.sha }}
          path: |
            dist/workbuddy-market-demo.mp4
            dist/workbuddy-market-demo-vertical.mp4
            dist/workbuddy-market-demo.zh-CN.srt
            dist/demo-manifest.json
          if-no-files-found: error
          retention-days: 30
