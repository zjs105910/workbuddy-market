# 隐私历史审计（v2.18，评审 10）：工作区干净 ≠ 历史干净。
# ci.yml 里随每次 push 跑的 privacy-audit.py 只扫当前跟踪文件；
# 这里的 --history 会扫 git log -p --all（含提交元数据），成本高，
# 不适合每次 push —— 定为每周一 + 手动触发。
name: Privacy history audit

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # --history 要扫全部提交的 diff，浅克隆没有历史
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Privacy audit (full git history)
        run: python scripts/privacy-audit.py --history
