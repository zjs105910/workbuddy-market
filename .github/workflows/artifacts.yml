name: Artifacts

# 注册表不可变产物的每日构建与发布（v2.17）：对 registry/plugins.json 里
# 每个收录条目，按审核固定的 sourceCommit 构建 Market Package，发布为
# GitHub Release 资产，再把 packageUrl / packageHash / manifestHash 回写
# 进 plugins.json —— 走 PR，不直推 main（与 registry.yml 同一供应链约束）。
#
# 哈希的稳定性是设计出来的：tarball 固定 sourceCommit + pack 规范化
# JSON + 重打包哈希稳定（v2.15 第 30 节盯防），同一天重跑得到同一份
# packageHash，--clobber 覆盖上传是安全的。
# v2.35 修订（原措辞把两件事混为一谈）：稳定的是**内容哈希**
# （packageHash/manifestHash，装的是什么）——zip 容器字节跨日并不同
# （时间戳等元数据，实测差几个字节）。别对 zip 字节哈希做 CI 盯防，
# 会误红；要复验就复验内容哈希（workbuddy-market verify）。
#
# v2.35 打包瘦身（NEXT_STEPS 任务4）：stage_clean 只带声明的 skills 并
# 剔除 VCS/缓存/系统垃圾；产物超过 64MB 的条目拒发固定工件（report.json
# 的 excluded 段），--patch-registry 拔掉其工件指针，安装回落 ghpm 源码
# 路线。阈值与理由见 scripts/build_artifacts.py 的 ARTIFACT_MAX_BYTES。
# v2.35.2 修订（用户实测：收录源在全新环境装不上）：tarball 里**指向包内
# 普通文件的相对符号链接**（上游 README/AGENTS.md 常见做法）构建期物化成
# 目标内容并如实记进 report.materializedLinks —— 产物里没有链接，安装端
# 链接防线不变；目录 / 悬空 / 成环 / 绝对 / 出包链接仍 fail-closed 拒绝。
on:
  schedule:
    - cron: "43 20 * * *"     # 每天 20:43 UTC（与 registry 的 21:21 错开）
  workflow_dispatch:          # 手动触发（收录新条目 / 客户端链路联调时用）

permissions:
  contents: write             # 创建 Release、推分支
  pull-requests: write        # 开 / 更新 PR

concurrency:
  group: artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pin 到完整 SHA（与 ci.yml 同一约束）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Build artifacts from sourceCommit
        run: python scripts/build_artifacts.py --out artifacts/

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('artifacts/report.json'))['built']))")
          if [ "$COUNT" = "0" ]; then
            echo "本轮没有任何条目构建成功，跳过发布"
            exit 0
          fi
          TAG="registry-artifacts-$(date -u +%F)"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip artifacts/*.attestation.json artifacts/report.json --clobber
          else
            gh release create "$TAG" artifacts/*.zip artifacts/*.attestation.json artifacts/report.json \
              --prerelease \
              --title "Registry artifacts $(date -u +%F)" \
              --notes "按 registry/plugins.json 的 sourceCommit 构建的不可变产物。packageHash 见 report.json；安装端（v2.16+）逐包校验；*.attestation.json 为构建证明（v2.20，可与注册表固定值对账）。Pre-release：仅为避免抢占 /releases/latest 指针，资产照常可下载。"
          fi

      - name: Patch registry with artifact fields
        if: env.RELEASE_TAG != ''
        # 块标量（|）逐行保留：纯标量折叠会把行尾 \ 变成转义空格，
        # 与 --registry 粘成带前导空格的词，argparse 报 unrecognized
        # arguments（run #1 实锤）。块内不用续行符，bash 天然多行执行。
        run: |
          python scripts/build_artifacts.py --patch-registry --out artifacts/ --registry registry/plugins.json --release-tag "$RELEASE_TAG"

      # PAT 建 PR（2026-10-12 CI 队列修复，与 registry.yml 同一批）：GITHUB_TOKEN 开的
      # PR，pull_request CI 永远挂 action_required（bot 无法自批，#3 实锤）。
      - name: Create PR if changed
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "!! 缺少 secrets.REGISTRY_PAT —— 没有 PAT，bot 开的 PR 拿不到 CI 结论（永远 action_required）"
            exit 1
          fi
          if git diff --quiet registry/plugins.json; then
            echo "registry/plugins.json 无变化，跳过"
            exit 0
          fi
          BR="registry-artifacts/$(date -u +%F)"
          TITLE="registry: artifact fields $(date -u +%F)"
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add registry/plugins.json
          git commit -m "registry: artifact fields $(date -u +%F) ($RELEASE_TAG)"
          # PAT push（2026-10-13 修复，与 registry.yml 同一批）：checkout 默认给 push
          # 挂 GITHUB_TOKEN 凭据，GITHUB_TOKEN 推的分支更新同样拿不到 CI（PR #7
          # 更新后 action_required 实锤）——push 必须和建 PR 同一 PAT 身份。
          # 用 -c 一次性覆盖 checkout 持久化的 extraheader：token 不进 URL、不落配置。
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -f origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "$TITLE" \
            --body "回写每日构建的不可变产物字段（packageUrl / packageHash / manifestHash）。安装端会按 packageHash 逐包校验；合并前等 CI 通过。" \
            || {
              if gh pr view "$BR" --json number >/dev/null 2>&1; then
                echo "该分支的 PR 已存在，跳过创建"
              else
                echo "!! gh pr create 失败且 PR 不存在 —— 检查 REGISTRY_PAT 是否有效且含 Contents RW + Pull requests RW"
                exit 1
              fi
            }
          NEW_NUM=$(gh pr view "$BR" --json number --jq .number)
          # 收敛（2026-10-12 CI 队列修复）：关闭被本次取代的同类型旧 PR，过期变更不再累积
          gh pr list --state open --limit 100 --json number,title,headRefName \
            --jq ".[] | select(.title == \"$TITLE\" and .headRefName != \"$BR\") | .number" \
          | while read -r n; do
              [ -n "$n" ] || continue
              gh pr close "$n" --comment "被 #$NEW_NUM（更新的 artifact fields 回写）取代，自动关闭。"
            done
