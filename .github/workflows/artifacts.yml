name: Artifacts

# 注册表不可变产物的每日构建与发布（v2.17）：对 registry/plugins.json 里
# 每个收录条目，按审核固定的 sourceCommit 构建 Market Package，发布为
# GitHub Release 资产，再把 packageUrl / packageHash / manifestHash 回写
# 进 plugins.json —— 走 PR，不直推 main（与 registry.yml 同一供应链约束）。
#
# 哈希的稳定性是设计出来的：tarball 固定 sourceCommit + pack 规范化
# JSON + 重打包哈希稳定（v2.15 第 30 节盯防），同一天重跑得到同一份
# packageHash，--clobber 覆盖上传是安全的。
on:
  schedule:
    - cron: "43 20 * * *"     # 每天 20:43 UTC（与 registry 的 21:21 错开）
  workflow_dispatch:          # 手动触发（收录新条目 / 客户端链路联调时用）

permissions:
  contents: write             # 创建 Release、推分支
  pull-requests: write        # 开 / 更新 PR

concurrency:
  group: artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pin 到完整 SHA（与 ci.yml 同一约束）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build artifacts from sourceCommit
        run: python scripts/build_artifacts.py --out artifacts/

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('artifacts/report.json'))['built']))")
          if [ "$COUNT" = "0" ]; then
            echo "本轮没有任何条目构建成功，跳过发布"
            exit 0
          fi
          TAG="registry-artifacts-$(date -u +%F)"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip artifacts/report.json --clobber
          else
            gh release create "$TAG" artifacts/*.zip artifacts/report.json \
              --title "Registry artifacts $(date -u +%F)" \
              --notes "按 registry/plugins.json 的 sourceCommit 构建的不可变产物。packageHash 见 report.json；安装端（v2.16+）会逐包校验。"
          fi

      - name: Patch registry with artifact fields
        if: env.RELEASE_TAG != ''
        run: python scripts/build_artifacts.py --patch-registry --out artifacts/ \
               --registry registry/plugins.json --release-tag "$RELEASE_TAG"

      - name: Create PR if changed
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet registry/plugins.json; then
            echo "registry/plugins.json 无变化，跳过"
            exit 0
          fi
          BR="registry-artifacts/$(date -u +%F)"
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add registry/plugins.json
          git commit -m "registry: artifact fields $(date -u +%F) ($RELEASE_TAG)"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "registry: artifact fields $(date -u +%F)" \
            --body "回写每日构建的不可变产物字段（packageUrl / packageHash / manifestHash）。安装端会按 packageHash 逐包校验；合并前等 CI 通过。" \
            || echo "该分支的 PR 已存在，跳过创建"
