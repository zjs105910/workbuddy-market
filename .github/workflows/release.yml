name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify matrix
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check
        shell: bash
        run: python -m py_compile market_core.py market_server.py launcher.py selftest.py src/workbuddy_market/*.py scripts/*.py

      - name: Privacy audit
        run: python scripts/privacy-audit.py

      - name: Validate community registry contract
        run: python scripts/validate_registry.py registry/plugins.json

      - name: POSIX semantic smoke
        if: runner.os != 'Windows'
        run: python scripts/posix-smoke.py

      - name: Unit tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q

      - name: Isolated selftest (Windows gate)
        if: runner.os == 'Windows'
        run: python selftest.py

  publish:
    name: Build packages, render demo, and publish Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check tag and changelog version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          source = Path("src/workbuddy_market/version.py").read_text(encoding="utf-8")
          match = re.search(r'MARKET_VERSION\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
              raise SystemExit("MARKET_VERSION not found")
          version = match.group(1)
          tag = os.environ["TAG_NAME"]
          if tag != "v" + version:
              raise SystemExit(f"Tag {tag} does not match MARKET_VERSION {version}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(r"^##\s+" + re.escape(version) + r"(?:\s|$)", changelog, re.M):
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(f"Release tag {tag} matches package version and CHANGELOG.md")
          PY

      - name: Install build and demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk
          python -m pip install --upgrade pip build pytest playwright
          python -m playwright install --with-deps chromium

      - name: Build Python distribution
        run: python -m build --outdir dist

      - name: Record demo video from tagged source
        run: |
          python scripts/record_demo.py \
            --output dist/workbuddy-market-demo.mp4 \
            --subtitles dist/workbuddy-market-demo.zh-CN.srt \
            --manifest dist/demo-manifest.json

      - name: Extract version-specific release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["TAG_NAME"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines)
                        if re.match(r"^##\s+" + re.escape(version) + r"(?:\s|$)", line)), None)
          if start is None:
              raise SystemExit(f"Missing changelog section for {version}")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].startswith("## ")), len(lines))
          section = "\n".join(lines[start:end]).strip()
          tail = (
              "\n\n---\n\n"
              "## Try WorkBuddy Market\n\n"
              "- Quick start: https://github.com/zjs105910/workbuddy-market/blob/main/README.md\n"
              "- Demo video and recording instructions: https://github.com/zjs105910/workbuddy-market/blob/main/docs/demo-video.md\n"
              "- Usage guide: https://github.com/zjs105910/workbuddy-market/blob/main/ADVANCED_GUIDE.md\n"
              "- Questions and bug reports: https://github.com/zjs105910/workbuddy-market/issues/new/choose\n"
              "- Contributing: https://github.com/zjs105910/workbuddy-market/blob/main/CONTRIBUTING.md\n\n"
              "If this helps your WorkBuddy workflow, consider starring the project and sharing a reproducible issue or pull request."
          )
          Path("dist/RELEASE_NOTES.md").write_text(section + tail + "\n", encoding="utf-8")
          PY

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz workbuddy-market-demo.mp4 workbuddy-market-demo.zh-CN.srt demo-manifest.json > SHA256SUMS.txt

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ASSETS=(
            dist/*.whl
            dist/*.tar.gz
            dist/workbuddy-market-demo.mp4
            dist/workbuddy-market-demo.zh-CN.srt
            dist/demo-manifest.json
            dist/SHA256SUMS.txt
          )
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WorkBuddy Market $TAG_NAME" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest \
              --verify-tag
          fi
