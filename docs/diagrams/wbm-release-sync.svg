        <line x1="40" y1="548" x2="920" y2="548" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="566" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="556" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="138" y="566" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">本地事实源</text>
        <rect x="250" y="556" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="268" y="566" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">远端渠道</text>
        <rect x="380" y="556" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="398" y="566" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">焦点</text>
        <rect x="470" y="556" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.05" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8" stroke-dasharray="4,4"/>
        <text x="488" y="566" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">失败出口</text>
        <line x1="590" y1="562" x2="614" y2="562" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="620" y="566" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">只读查询</text>

      </svg>
